[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o1-rsi"
version = "0.1.0"
description = "O1-RSI: island arm-menus (light strategy archive) + in-island UCB bandit for mid-run search unsticking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
o1-rsi = "o1.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["o1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
